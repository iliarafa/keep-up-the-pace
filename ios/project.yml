name: KeepThePace
options:
  bundleIdPrefix: com.iliasrafailidis
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3DLV25C9VK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PaceKit:
    path: PaceKit
targets:
  KeepThePace:
    type: application
    platform: iOS
    sources: [KeepThePace, Shared]
    dependencies:
      - package: PaceKit
      - target: PaceActivity
      - target: KeepThePaceWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KeepThePace/Info.plist
      properties:
        CFBundleDisplayName: Keep the Pace
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Keep the Pace uses your location to measure how far you are from your destination and whether you're on schedule.
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseWalk: Keep the Pace needs your precise location to tell whether you're on schedule to within a few seconds.
        NSHealthShareUsageDescription: Keep the Pace reads your walking workouts so it can save walks you finish.
        NSHealthUpdateUsageDescription: Keep the Pace saves finished walks to Apple Health as walking workouts.
    entitlements:
      path: KeepThePace/KeepThePace.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iliasrafailidis.delta]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  KeepThePaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KeepThePaceTests]
    dependencies:
      - target: KeepThePace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta.tests
        TARGETED_DEVICE_FAMILY: "1"
  KeepThePaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KeepThePaceUITests]
    dependencies:
      - target: KeepThePace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta.uitests
        TEST_TARGET_NAME: KeepThePace
        TARGETED_DEVICE_FAMILY: "1"
  PaceActivity:
    type: app-extension
    platform: iOS
    sources: [PaceActivity, Shared]
    dependencies:
      - package: PaceKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta.PaceActivity
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PaceActivity/Info.plist
      properties:
        CFBundleDisplayName: Pace Activity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PaceActivity/PaceActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iliasrafailidis.delta]
  KeepThePaceWatch:
    type: application
    platform: watchOS
    sources: [KeepThePaceWatch]
    dependencies:
      - package: PaceKit
      - target: PaceComplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta.watchkitapp
    info:
      path: KeepThePaceWatch/Info.plist
      properties:
        CFBundleDisplayName: Keep the Pace
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.iliasrafailidis.delta
        WKBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: Keep the Pace uses your location to measure how far you are from your destination and whether you're on schedule.
        NSHealthShareUsageDescription: Keep the Pace reads your walking workouts so it can save walks you finish.
        NSHealthUpdateUsageDescription: Keep the Pace saves finished walks to Apple Health as walking workouts.
    entitlements:
      path: KeepThePaceWatch/KeepThePaceWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iliasrafailidis.delta]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  PaceComplication:
    type: app-extension
    platform: watchOS
    sources: [PaceComplication]
    dependencies:
      - package: PaceKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliasrafailidis.delta.watchkitapp.PaceComplication
    info:
      path: PaceComplication/Info.plist
      properties:
        CFBundleDisplayName: Pace Complication
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PaceComplication/PaceComplication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iliasrafailidis.delta]
schemes:
  KeepThePace:
    build:
      targets:
        KeepThePace: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeepThePaceTests
        - KeepThePaceUITests
  KeepThePaceWatch:
    build:
      targets:
        KeepThePaceWatch: all
    run:
      config: Debug
